<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Scanner Frame -->
  <g filter="url(#shadow)">
    <!-- Scanner Corners -->
    <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 392 332 L 392 372 A 20 20 0 0 1 372 392 L 332 392" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 180 392 L 140 392 A 20 20 0 0 1 120 372 L 120 332" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <!-- Central Biometric Face & Shield -->
    <!-- Head Contour -->
    <path d="M 256 160 C 210 160 178 196 178 244 C 178 288 206 322 242 338 L 256 344 L 270 344 C 306 328 334 294 334 244 C 334 196 302 160 256 160 Z" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Eyes -->
    <ellipse cx="224" cy="228" rx="10" ry="14" fill="#ffffff"/>
    <ellipse cx="288" cy="228" rx="10" ry="14" fill="#ffffff"/>
    
    <!-- Verified Checkmark Badge at bottom-right corner of scanner -->
    <circle cx="340" cy="340" r="44" fill="#10b981"/>
    <path d="M 324 340 L 336 352 L 358 328" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
